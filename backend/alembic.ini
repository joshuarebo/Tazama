# Alembic configuration. The database URL is NOT here: env.py reads it from settings,
# which read the environment (CLAUDE.md section 4).
[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
timezone = UTC
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Formatting is handled by `make fmt` / pre-commit, which run ruff over the whole repo.
# A hook here would need ruff on the alembic process path and fails on some machines.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

