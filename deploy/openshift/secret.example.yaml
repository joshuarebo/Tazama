# NOT APPLIED. Documentation only, and deliberately outside kustomization.yaml.
#
# An earlier version of this file was listed in the base kustomization. `oc apply -k`
# would then have overwritten the real cluster Secret with these placeholder values on
# every deploy, which means a *known* JWT_SECRET (anyone can mint an admin token) and a
# known PSEUDONYM_SALT (every pseudonym becomes reversible by brute force). That is why
# this lives here and why nothing references it.
#
# Create the real Secret once per environment, out of band:
#
#   oc create secret generic tazama-secrets #     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" #     --from-literal=PSEUDONYM_SALT="$(openssl rand -base64 48)" #     --from-literal=DB_DSN=... #     -n "$OPENSHIFT_PROJECT"
#
# Or, preferably, use the cluster's ExternalSecret / SealedSecret operator so rotation is
# managed rather than manual. The settings validator rejects any value containing
# "replace", so a placeholder that reaches a running process fails startup loudly instead
# of silently becoming the production signing key.
---
# Secrets are NOT in git. This documents the keys the deployment expects; the values are
# created once per environment by the platform team, or injected from the cluster's
# secret store. `make openshift-secret` prints the command without the values.
apiVersion: v1
kind: Secret
metadata:
  name: tazama-secrets
  annotations:
    tazama.io/managed-by: "platform team, out of band"
type: Opaque
stringData:
  DB_DSN: "REPLACE_IN_CLUSTER"
  DB_USER: "REPLACE_IN_CLUSTER"
  DB_PASSWORD: "REPLACE_IN_CLUSTER"
  JWT_SECRET: "REPLACE_IN_CLUSTER"
  PSEUDONYM_SALT: "REPLACE_IN_CLUSTER"
  OIDC_ISSUER: "REPLACE_IN_CLUSTER"
  OIDC_CLIENT_ID: "REPLACE_IN_CLUSTER"
  OIDC_CLIENT_SECRET: "REPLACE_IN_CLUSTER"
  LLM_BASE_URL: "REPLACE_IN_CLUSTER"
  LLM_API_KEY: "REPLACE_IN_CLUSTER"
  TEAMS_WEBHOOK_URL: "REPLACE_IN_CLUSTER"
