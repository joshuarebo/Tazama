<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAZAMA</title>
<style>
:root{
  --bg:#fbfbfc; --card:#fff; --line:#e4e7ec; --soft:#f4f6f8;
  --ink:#141a20; --mid:#596673; --dim:#8b96a2;
  --a:#0f6f66; --a-soft:#e6f3f1; --a-line:#a5d4ce;
  --warn:#8a5a10; --warn-soft:#fdf2dd;
  --ok:#1a6b40; --ok-soft:#e6f4ea;
  --r:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1419; --card:#161d24; --line:#2a333d; --soft:#1b232b;
  --ink:#e9eef3; --mid:#a6b2be; --dim:#78848f;
  --a:#4fbcb2; --a-soft:#10322f; --a-line:#1e544e;
  --warn:#e0b468; --warn-soft:#2f2612;
  --ok:#74d39b; --ok-soft:#10301f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.02em}
p{margin:0}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}

/* header */
header{border-bottom:1px solid var(--line);background:var(--card)}
.top{display:flex;align-items:baseline;gap:14px;padding:22px 0 18px;flex-wrap:wrap}
.logo{font-size:21px;font-weight:800;letter-spacing:.16em}
.tag{font-size:14px;color:var(--dim)}
nav{display:flex;gap:4px;padding-bottom:4px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mid);
  font:inherit;font-size:15px;padding:10px 14px;cursor:pointer;white-space:nowrap;
  transition:color .18s,border-color .18s}
nav button:hover{color:var(--ink)}
nav button[aria-current]{color:var(--a);border-color:var(--a);font-weight:600}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:4px}

main{padding:48px 0 80px}
.lead{font-size:21px;line-height:1.5;color:var(--ink)}
.body{font-size:16px;color:var(--mid);margin-top:16px}
h2.sec{font-size:27px;margin-bottom:10px}
h3.sub{font-size:17px;margin-bottom:6px}
.note{font-size:14px;color:var(--dim)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.card+.card{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.sp{height:40px}
.sp.s{height:24px}

/* the walkthrough */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.steps button{background:var(--card);border:1px solid var(--line);border-radius:999px;
  color:var(--mid);font:inherit;font-size:14px;padding:6px 14px;cursor:pointer;
  transition:all .18s}
.steps button:hover{border-color:var(--a-line)}
.steps button[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:#fff;
  font-weight:600}
@media (prefers-color-scheme:dark){.steps button[aria-pressed="true"]{color:#06211e}}

.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:28px;min-height:270px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stage .num{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--a);
  text-transform:uppercase}
.stage h3{font-size:24px;margin:8px 0 14px}
.stage .what{font-size:17px;color:var(--ink);line-height:1.55}
.stage .how{font-size:15px;color:var(--mid);margin-top:14px;line-height:1.6}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);
  border-radius:8px;padding:10px 14px;margin-top:18px;font-size:14px;color:var(--mid)}
.pill b{color:var(--ink)}
.navrow{display:flex;gap:10px;margin-top:22px;align-items:center}
.btn{background:var(--a);border:1px solid var(--a);color:#fff;border-radius:8px;
  font:inherit;font-size:15px;padding:9px 18px;cursor:pointer;font-weight:600;
  transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--mid);border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
@media (prefers-color-scheme:dark){.btn{color:#06211e}}

/* screen sketches */
.shot{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden}
.shot .bar{background:var(--soft);border-bottom:1px solid var(--line);padding:9px 14px;
  font-size:13px;color:var(--dim);display:flex;gap:7px;align-items:center}
.shot .bar i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.shot .in{padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:16px;
  margin-bottom:18px}
.kpi .n{font-size:26px;font-weight:700;letter-spacing:-.025em}
.kpi .l{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;
  font-weight:600}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row .r{color:var(--mid);white-space:nowrap}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.chip.a{background:var(--a-soft);color:var(--a)}
.chip.w{background:var(--warn-soft);color:var(--warn)}
.chip.o{background:var(--ok-soft);color:var(--ok)}

.quote{border-left:3px solid var(--a-line);padding:4px 0 4px 16px;color:var(--mid);
  font-size:15px;margin-top:16px}
.flag{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:14px 16px;
  font-size:14.5px;line-height:1.6;margin-top:18px}
.good{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:14px 16px;
  font-size:14.5px;line-height:1.6;margin-top:18px}

ul.list{margin:14px 0 0;padding-left:20px;color:var(--mid);font-size:15.5px}
ul.list li{margin:8px 0}
ul.list b{color:var(--ink)}

footer{border-top:1px solid var(--line);padding:26px 0 40px;font-size:13.5px;color:var(--dim)}
.mono{font-family:var(--mono);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:620px){
  main{padding:32px 0 60px}
  h2.sec{font-size:23px}
  .lead{font-size:19px}
  .stage{padding:22px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="top">
      <span class="logo">TAZAMA</span>
      <span class="tag">Network care intelligence, demo with sample data</span>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    All figures and names on this page are sample data, generated for demonstration.
    No real customer, system or network element is shown. The wordmark is a placeholder.
  </div>
</footer>

<script>
/* ------------------------------------------------------------------ data */

const STEPS = [
  {
    n: "Step 1",
    h: "Something goes wrong",
    what: "A cell in Nairobi starts dropping calls at 10:00. Nobody has reported it yet.",
    how: "Two things notice at the same time. The network sends an alarm and its hourly performance numbers fall. Customers start sending messages through the app, SMS and the call centre.",
    pill: "<b>Important:</b> the system does not wait for complaints. A fault with no complaints still raises an incident."
  },
  {
    n: "Step 2",
    h: "Work out who is affected",
    what: "The complaint is matched to the cell that was serving that customer, and the customer's phone number is replaced with a code.",
    how: "From that point on, nothing downstream sees a phone number. Not the reports, not the logs, not the AI.",
    pill: "Today about <b>half</b> of complaints can be matched to a specific cell. That number is measured and shown, not hidden."
  },
  {
    n: "Step 3",
    h: "Group it into one incident",
    what: "One broken fibre link can take 27 cells offline. Those become one incident, not 27 tickets.",
    how: "The system knows how the network is wired, so it traces the affected cells upwards and finds the single piece of equipment they share.",
    pill: "<b>Why this matters:</b> the engineer gets one ticket pointing at the actual broken thing, instead of 27 alarms to sift through."
  },
  {
    n: "Step 4",
    h: "Explain what is wrong",
    what: "The system checks a set of rules first. Is there planned maintenance? Is there an alarm on shared equipment? Is the cell simply congested?",
    how: "If the rules are confident, that is the answer and no AI is used. AI is only brought in for the unclear cases, and it has to point at the evidence it used.",
    pill: "On our test cases the rules alone get the cause right <b>every time</b>, with no AI involved."
  },
  {
    n: "Step 5",
    h: "Decide how urgent it is",
    what: "Number of customers affected, business accounts involved, service level exposure, how long it has been running.",
    how: "Each of those contributes a visible amount to the score, so a priority can be explained months later if somebody questions it.",
    pill: "<b>No black box.</b> You can always see why one incident ranked above another."
  },
  {
    n: "Step 6",
    h: "Tell the customer, if a person agrees",
    what: "The system drafts a message from an approved template, in English and Swahili, and puts it in front of a human.",
    how: "Nothing goes out automatically. The message cannot be freely written, quiet hours are respected, and anyone who opted out is skipped.",
    pill: "<b>The person who writes the message cannot be the person who approves it.</b>"
  },
  {
    n: "Step 7",
    h: "Fix it, check it, report it",
    what: "The system recommends a repair procedure, confirms afterwards that the numbers actually recovered, and closes the incident.",
    how: "A daily summary goes to the network team's channel. Every decision along the way is recorded with who did it and why.",
    pill: "Recommendations only. <b>The system has no ability to change anything on the network.</b>"
  }
];

const VIEWS = {
  why: () => `
    <p class="lead">Right now a network fault becomes a customer problem before anyone
      in the operations centre knows it is a fault.</p>

    <p class="body">The network's own data saw it first. A cell's performance dropped, an
      alarm went off. But nothing connects that to the forty people who are now calling to
      complain, because those live in different systems owned by different teams.</p>

    <p class="body">So three things go wrong at once.</p>

    <div class="sp s"></div>
    <div class="grid g3">
      <div class="card">
        <h3 class="sub">The customer</h3>
        <p class="note">Finds out their service is broken by trying to use it, then waits on
          hold to be told something the operator already knew.</p>
      </div>
      <div class="card">
        <h3 class="sub">The engineer</h3>
        <p class="note">Spends the first hour of an incident gathering context from five
          systems instead of fixing anything.</p>
      </div>
      <div class="card">
        <h3 class="sub">The business</h3>
        <p class="note">Pays for thousands of calls that only happened because nobody was
          told.</p>
      </div>
    </div>

    <div class="sp"></div>
    <div class="card">
      <h3 class="sub">What TAZAMA does</h3>
      <p class="body" style="margin-top:8px">It joins the two halves. The network's own
        signals on one side, what customers are saying on the other. When they line up, it
        raises one incident, works out who is affected, explains the likely cause, and
        proposes a message for a person to approve.</p>
      <div class="quote">The network already knows. TAZAMA is the part that tells somebody.</div>
    </div>

    <div class="sp"></div>
    <h3 class="sub">What it is worth</h3>
    <ul class="list">
      <li><b>Fewer calls.</b> Every customer told before they call is a call that does not
        happen. The system counts them.</li>
      <li><b>Faster repairs.</b> Diagnosis starts with evidence attached instead of a blank
        page.</li>
      <li><b>Fewer surprises.</b> Service level exposure is visible per incident, rather
        than discovered at the end of the month.</li>
      <li><b>A path to predicting faults.</b> Covered on the last tab. It needs data we do
        not currently collect, so it is honest to call it next, not now.</li>
    </ul>`,

  how: () => `
    <h2 class="sec">Follow one fault through the system</h2>
    <p class="body">Seven steps, start to finish. Click through them.</p>
    <div class="sp s"></div>
    <div class="steps" id="steps" role="group" aria-label="Steps">
      ${STEPS.map((s, i) => `<button type="button" data-step="${i}"
        aria-pressed="${i === step}">${i + 1}</button>`).join("")}
    </div>
    <div class="stage" id="stage">${stageHTML()}</div>`,

  app: () => `
    <h2 class="sec">What people actually see</h2>
    <p class="body">Three of the screens, simplified. The real console has nine.</p>

    <div class="sp s"></div>
    <h3 class="sub">The operations centre view</h3>
    <p class="note">Every live incident, ranked by how many customers it is hurting.</p>
    <div class="sp s"></div>
    <div class="shot">
      <div class="bar"><i></i><i></i><i></i> Command centre</div>
      <div class="in">
        <div class="kpis">
          <div class="kpi"><div class="l">Live</div><div class="n">17</div></div>
          <div class="kpi"><div class="l">Customers hit</div><div class="n">140k</div></div>
          <div class="kpi"><div class="l">Complaints today</div><div class="n">1,053</div></div>
          <div class="kpi"><div class="l">Awaiting approval</div><div class="n">0</div></div>
        </div>
        <div class="row"><span><b>Transmission link down</b> <span class="chip w">27 cells</span></span>
          <span class="r">Nairobi, 74,950 customers</span></div>
        <div class="row"><span><b>Site offline</b> <span class="chip w">4 cells</span></span>
          <span class="r">Mombasa, 11,114 customers</span></div>
        <div class="row"><span><b>Congestion</b> <span class="chip a">6 cells</span></span>
          <span class="r">Nairobi, 9,420 customers</span></div>
      </div>
    </div>

    <div class="sp"></div>
    <h3 class="sub">Inside one incident</h3>
    <p class="note">What took an hour to assemble by hand is already here.</p>
    <div class="sp s"></div>
    <div class="shot">
      <div class="bar"><i></i><i></i><i></i> Incident detail</div>
      <div class="in">
        <div class="row"><span class="r">Shared equipment</span>
          <span class="mono">TND_MBXYJ688JBMC66</span></div>
        <div class="row"><span class="r">Customers affected</span><span>74,950 across 27 cells</span></div>
        <div class="row"><span class="r">Business accounts</span><span>52</span></div>
        <div class="row"><span class="r">Likely cause</span>
          <span>Planned maintenance <span class="chip o">confident</span></span></div>
        <div class="row"><span class="r">Decided by</span><span>Rules, no AI needed</span></div>
        <div class="good">The incident looked like a failure, but there was approved
          maintenance covering that exact window. So nobody gets woken up. A system that
          cannot tell planned work from a fault creates false alarms until people stop
          trusting it.</div>
      </div>
    </div>

    <div class="sp"></div>
    <h3 class="sub">The call centre view</h3>
    <p class="note">What the agent sees when the customer rings.</p>
    <div class="sp s"></div>
    <div class="shot">
      <div class="bar"><i></i><i></i><i></i> Customer lookup</div>
      <div class="in">
        <div class="row"><span class="r">Customer</span>
          <span class="mono">SUB-INQCJH5UOHGNLAP2</span></div>
        <div class="row"><span class="r">Area</span><span>Nairobi, Langata</span></div>
        <div class="row"><span class="r">Known problem</span>
          <span>Yes <span class="chip w">being worked on</span></span></div>
        <div class="sp s"></div>
        <p class="note" style="font-weight:600;color:var(--mid)">Approved wording, read as written</p>
        <div class="quote" style="margin-top:8px">We are aware of a service problem in your
          area and our engineers are working on it. We are sorry for the disruption.</div>
        <div class="flag">There is no free text box on this screen. The agent reads an
          approved message. Nobody invents a restoration time, because an invented promise
          repeated across a call centre is worse than saying nothing.</div>
      </div>
    </div>`,

  next: () => `
    <h2 class="sec">What it would take to run this for real</h2>
    <p class="body">The software is built and tested. What is left is access and
      permission, not construction.</p>

    <div class="sp s"></div>
    <div class="card">
      <h3 class="sub">1. Connect the data</h3>
      <p class="body" style="margin-top:8px">Ten feeds, all read only. Site and cell
        records, network alarms, hourly performance figures, planned maintenance, customer
        records, complaints and call centre logs.</p>
      <p class="note" style="margin-top:12px">Pointing at real tables is a configuration
        change, not a code change. The system never writes back to any of them.</p>
    </div>

    <div class="card">
      <h3 class="sub">2. Three privacy steps before any real customer record</h3>
      <ul class="list" style="font-size:15px">
        <li><b>Deletion.</b> Removing a customer has to remove everything derived from them.</li>
        <li><b>Key rotation.</b> Agreeing what happens to past reporting when the code that
          hides phone numbers is changed.</li>
        <li><b>A minimum group size</b> below which a single cell is not reported on its own.</li>
      </ul>
      <p class="note" style="margin-top:12px">Days of work each, but they are obligations
        rather than nice to have.</p>
    </div>

    <div class="card">
      <h3 class="sub">3. Two operational pieces</h3>
      <p class="body" style="margin-top:8px">A Teams channel address so the daily summary
        can actually be delivered, and a connection to an internal AI model so the assisted
        parts can be tested against the real thing rather than a stand in.</p>
    </div>

    <div class="sp"></div>
    <h2 class="sec" style="font-size:22px">Where this goes next</h2>
    <p class="body">Today the system spots a fault early. Predicting one before it happens
      is a different capability, and it needs readings we do not collect yet. Three
      realistic places to start:</p>

    <div class="sp s"></div>
    <div class="grid g3">
      <div class="card">
        <h3 class="sub">Power and batteries</h3>
        <p class="note">Watch how fast a site's battery drains against its own normal. Flag
          it hours before the site goes dark, so a crew refuels first.</p>
        <p class="note" style="margin-top:10px;color:var(--a);font-weight:600">Start here.
          One data feed, easy to prove.</p>
      </div>
      <div class="card">
        <h3 class="sub">Fibre links</h3>
        <p class="note">Transmission equipment degrades for weeks before it fails. Rising
          error counts would flag it days ahead, turning a 2am emergency into planned work.</p>
      </div>
      <div class="card">
        <h3 class="sub">Antenna alignment</h3>
        <p class="note">Wind shifts an antenna and coverage shrinks. A one sided drop on a
          single sector points at it, without sending someone to climb the tower.</p>
      </div>
    </div>

    <div class="flag">To be straight about it: none of these three is built, and all of them
      need data the network team would have to give us. The groundwork they rely on,
      knowing what normal looks like for each piece of equipment, is already there.</div>

    <div class="sp"></div>
    <div class="card">
      <h3 class="sub">What this demo is not</h3>
      <ul class="list" style="font-size:15px">
        <li>The data is invented. It is shaped to look realistic, but it is not real
          traffic, and accuracy here does not predict accuracy on real data.</li>
        <li>The system cannot act on the network, and that is deliberate.</li>
        <li>AI suggests. Rules decide. People approve.</li>
      </ul>
    </div>`
};

const TABS = [
  ["why", "Why it exists"],
  ["how", "How it works"],
  ["app", "What it looks like"],
  ["next", "Going live"]
];

/* ------------------------------------------------------------ rendering */

let tab = "why";
let step = 0;

function stageHTML() {
  const s = STEPS[step];
  return `
    <div class="num">${s.n} of ${STEPS.length}</div>
    <h3>${s.h}</h3>
    <p class="what">${s.what}</p>
    <p class="how">${s.how}</p>
    <div class="pill">${s.pill}</div>
    <div class="navrow">
      <button class="btn ghost" id="prev" ${step === 0 ? "disabled" : ""}>Back</button>
      <button class="btn" id="next" ${step === STEPS.length - 1 ? "disabled" : ""}>Next step</button>
    </div>`;
}

function draw() {
  document.getElementById("nav").innerHTML = TABS.map(([id, label]) =>
    `<button type="button" data-tab="${id}"${id === tab ? ' aria-current="page"' : ""}>${label}</button>`
  ).join("");
  document.getElementById("main").innerHTML = VIEWS[tab]();
}

function drawStage() {
  document.getElementById("stage").innerHTML = stageHTML();
  document.querySelectorAll("[data-step]").forEach((b) => {
    b.setAttribute("aria-pressed", String(Number(b.dataset.step) === step));
  });
}

document.addEventListener("click", (e) => {
  const t = e.target;

  const tb = t.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; draw(); window.scrollTo(0, 0); return; }

  const st = t.closest("[data-step]");
  if (st) { step = Number(st.dataset.step); drawStage(); return; }

  if (t.id === "next" && step < STEPS.length - 1) { step++; drawStage(); return; }
  if (t.id === "prev" && step > 0) { step--; drawStage(); }
});

document.addEventListener("keydown", (e) => {
  if (tab !== "how") return;
  if (e.key === "ArrowRight" && step < STEPS.length - 1) { step++; drawStage(); }
  if (e.key === "ArrowLeft" && step > 0) { step--; drawStage(); }
});

draw();
</script>
</body>
</html>
